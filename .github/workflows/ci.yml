name: CI
on: [push, pull_request]
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==22.1.5
      - name: Check code formatting
        run: |
          git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' '*.hxx' \
            ':!test/gtest/**' ':!test/fmt/**' ':!test/dragonbox/**' \
            ':!test/canada.h' ':!test/boundary-bits.h' \
            | xargs -0 clang-format -i --style=file
          git diff --exit-code
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build
      # --config/-C is required for multi-config generators and a noop on
      # single-config ones.
      - run: cmake --build build --config Debug -j
      - run: ctest --test-dir build -C Debug --output-on-failure
